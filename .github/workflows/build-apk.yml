name: Build Luna LIVE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract Luna LIVE
        run: |
          unzip -q LunaLIVE-cloud-build.zip
          echo "=== ESTRUCTURA ==="
          find . -maxdepth 5 -type f | head -250

      - name: Locate Android project
        run: |
          PROJECT=$(find . -name gradlew -type f -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró gradlew"
            find . -maxdepth 7 -type f | sort | head -400
            exit 1
          fi

          echo "Proyecto: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" \
              -type f -name sdkmanager 2>/dev/null | head -1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager"
            echo "=== SDK ==="
            find /usr/local/lib/android/sdk -maxdepth 5 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "sdkmanager encontrado en:"
          echo "$SDKMANAGER"

          SDK_DIR="$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")"
          echo "SDK_DIR=$SDK_DIR"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find APK
        if: success()
        run: |
          echo "================================"
          echo "       APK GENERADO"
          echo "================================"

          find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LunaLIVE-debug-apk
          path: |
            ${{ env.PROJECT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
