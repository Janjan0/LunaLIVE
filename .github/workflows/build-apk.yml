name: Build Luna LIVE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project
        run: |
          unzip -q LunaLIVE-cloud-build.zip
          echo "=== ESTRUCTURA ==="
          find . -maxdepth 5 -type f | head -200

      - name: Locate Android project
        run: |
          PROJECT=$(find . -name gradlew -type f -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No se encontró gradlew"
            echo "=== ARCHIVOS DISPONIBLES ==="
            find . -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          echo "Proyecto Android encontrado en: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT/gradlew"

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "=== APK GENERADO ==="
          find "$PROJECT" -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LunaLIVE-debug-apk
          path: |
            ${{ env.PROJECT }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
